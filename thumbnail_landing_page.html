<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>Video</title>
<style>
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; }
  body {
    display:grid; place-items:center; overflow:hidden;
    background:#090909; font-family:system-ui, sans-serif;
  }
  .stage { width:100%; height:100%; display:grid; place-items:center; padding:18px; }
  .thumbnail {
    position:relative; display:block; width:min(100%, 1100px); max-height:100%;
    aspect-ratio:16/9; border:0; padding:0; overflow:hidden; border-radius:10px;
    background:#171717; cursor:pointer; text-decoration:none;
  }
  .thumbnail img { width:100%; height:100%; object-fit:contain; display:block; transition:transform .25s ease; }
  .thumbnail:hover img { transform:scale(1.035); }
  .play {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:76px; height:76px; border-radius:50%; display:grid; place-items:center;
    background:rgba(0,0,0,.66); border:2px solid rgba(255,255,255,.92);
    box-shadow:0 3px 18px rgba(0,0,0,.35);
  }
  .play:after {
    content:""; margin-left:6px; width:0; height:0;
    border-top:14px solid transparent; border-bottom:14px solid transparent;
    border-left:21px solid white;
  }
  #adminToggle {
    position:fixed; right:10px; bottom:10px; width:22px; height:22px;
    opacity:.03; border:0; background:#fff; border-radius:50%; cursor:pointer;
  }
  #adminPanel {
    display:none; position:fixed; inset:0; z-index:5; overflow:auto;
    background:rgba(0,0,0,.92); color:white; padding:22px;
    align-items:center; justify-content:center;
  }
  .panelCard { width:min(100%,440px); background:#1b1b1b; padding:20px; border-radius:14px; }
  .panelCard h2 { margin:0 0 16px; font-size:20px; }
  .panelCard label { display:block; margin:12px 0 6px; font-size:14px; }
  .panelCard input { width:100%; padding:11px; border-radius:8px; border:1px solid #555; background:#101010; color:#fff; }
  .buttons { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .buttons button { padding:10px 14px; border:0; border-radius:8px; cursor:pointer; }
  #saveBtn { background:#fff; color:#111; }
  #closeBtn { background:#444; color:#fff; }
  #status { font-size:13px; color:#ddd; min-height:18px; margin-top:10px; }
  @media (max-width:600px) {
    .stage { padding:10px; }
    .thumbnail { aspect-ratio:16/9; border-radius:6px; }
    .play { width:60px; height:60px; }
    .play:after { border-top-width:11px; border-bottom-width:11px; border-left-width:17px; }
  }
</style>
</head>
<body>
<main class="stage">
  <a id="thumbnailLink" class="thumbnail" href="#" target="_blank" rel="noopener noreferrer" aria-label="Play video">
    <img id="thumbImage" alt="Video thumbnail">
    <span class="play" aria-hidden="true"></span>
  </a>
</main>

<button id="adminToggle" aria-label="Open admin settings" title="Admin"></button>
<section id="adminPanel" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
  <div class="panelCard">
    <h2 id="adminTitle">Admin settings</h2>
    <label for="password">Admin password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Enter admin password">
    <div id="adminFields" hidden>
      <label for="imageUpload">Choose thumbnail photo</label>
      <input id="imageUpload" type="file" accept="image/*">
      <label for="videoUrl">Video link (opens when thumbnail is clicked)</label>
      <input id="videoUrl" type="url" placeholder="https://…">
    </div>
    <div class="buttons">
      <button id="unlockBtn">Unlock</button>
      <button id="saveBtn" hidden>Save</button>
      <button id="closeBtn" type="button">Close</button>
    </div>
    <div id="status" role="status"></div>
  </div>
</section>

<script>
(() => {
  // DEMO ONLY: client-side passwords are visible to anyone who inspects this file.
  // Use server-side authentication before deploying publicly.
  const ADMIN_PASSWORD = '@Sohel73405@';
  const DEFAULT_IMAGE = '';
  const $ = id => document.getElementById(id);
  const panel = $('adminPanel');
  const image = $('thumbImage');
  const link = $('thumbnailLink');
  let pendingImage = null;

  function applySaved() {
    const savedImage = localStorage.getItem('landingThumbnail');
    const savedUrl = localStorage.getItem('landingVideoUrl') || '';
    if (savedImage) {
      image.src = savedImage;
      image.style.visibility = 'visible';
    } else {
      image.removeAttribute('src');
      image.style.visibility = 'hidden';
    }
    link.href = savedUrl || '#';
    link.style.cursor = savedUrl ? 'pointer' : 'default';
  }
  applySaved();

  $('adminToggle').addEventListener('click', () => {
    panel.style.display = 'flex';
    $('password').value = '';
    $('adminFields').hidden = true;
    $('saveBtn').hidden = true;
    $('unlockBtn').hidden = false;
    $('status').textContent = '';
  });
  $('closeBtn').addEventListener('click', () => panel.style.display = 'none');

  $('unlockBtn').addEventListener('click', () => {
    if ($('password').value === ADMIN_PASSWORD) {
      $('adminFields').hidden = false;
      $('saveBtn').hidden = false;
      $('unlockBtn').hidden = true;
      $('videoUrl').value = localStorage.getItem('landingVideoUrl') || '';
      $('status').textContent = 'Choose a photo and/or add a video link, then Save.';
    } else {
      $('status').textContent = 'Incorrect password.';
    }
  });

  $('imageUpload').addEventListener('change', event => {
    const file = event.target.files && event.target.files[0];
    if (!file) { pendingImage = null; return; }
    if (!file.type.startsWith('image/')) {
      $('status').textContent = 'Please choose an image file.';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      pendingImage = reader.result;
      $('status').textContent = 'Photo ready to save.';
    };
    reader.readAsDataURL(file);
  });

  $('saveBtn').addEventListener('click', () => {
    const url = $('videoUrl').value.trim();
    if (url && !/^https?:\/\//i.test(url)) {
      $('status').textContent = 'Please enter a valid link starting with https:// or http://.';
      return;
    }
    try {
      if (pendingImage) localStorage.setItem('landingThumbnail', pendingImage);
      if (url) localStorage.setItem('landingVideoUrl', url);
      else localStorage.removeItem('landingVideoUrl');
      applySaved();
      pendingImage = null;
      $('status').textContent = 'Saved in this browser.';
    } catch (e) {
      $('status').textContent = 'Could not save the image. Try a smaller photo.';
    }
  });

  link.addEventListener('click', event => {
    if (!localStorage.getItem('landingVideoUrl')) event.preventDefault();
  });
})();
</script>
</body>
</html>
